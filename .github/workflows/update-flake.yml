name: Update Flake Inputs

on:
  schedule:
    - cron: "0 3 * * 0" # 每周日 UTC 03:00（北京时间 11:00）
  workflow_dispatch: # 手动触发

concurrency:
  group: update-flake-inputs
  cancel-in-progress: true

jobs:
  update:
    name: Update flake inputs & open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Fetch full history so the PR diff is accurate
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7
        with:
          # Run 38085235502 paid 79 "Unable to authenticate to FlakeHub"
          # annotations: use-flakehub defaults to true and this repo has no
          # FlakeHub registration, so every run bought failed-auth noise.
          use-flakehub: false

      # Capture current lock state for the PR diff summary
      - name: Snapshot current flake.lock
        run: cp flake.lock flake.lock.before

      # Run 38085235502 root cause: a branch-HEAD nixpkgs lock runs AHEAD
      # of what Hydra has built into the channel — the first CI on that
      # lock then source-builds the uncached tail (that run: 89 minutes
      # of desktop-stack builds, xdg-desktop-portal's integration battery
      # included, then the host-toplevels 90-minute timeout cancelled the
      # leg). Pin the weekly nixpkgs bump to the CHANNEL SNAPSHOT instead:
      # channels.nixos.org exposes the exact git-revision the nixos-26.05
      # channel currently serves — fully built by Hydra, fully
      # substitutable from cache.nixos.org. Freshness becomes channel
      # cadence (a release cut every day or two) instead of branch tip.
      - name: Update all flake inputs
        run: |
          CHAN_REV=$(curl -fsSL https://channels.nixos.org/nixos-26.05/git-revision)
          echo "nixos-26.05 channel snapshot: $CHAN_REV"
          nix flake update
          nix flake lock --override-input nixpkgs "github:NixOS/nixpkgs/$CHAN_REV"

      # Generate human-readable diff of what changed
      - name: Generate update summary
        id: summary
        run: |
          if diff -q flake.lock.before flake.lock > /dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to flake inputs."
          else
            echo "changed=true" >> $GITHUB_OUTPUT

            # Simple diff report
            DIFF=$(diff flake.lock.before flake.lock || true)
            LINES=$(echo "$DIFF" | wc -l)
            echo "Lock changed: $LINES diff lines"

            # Build PR body
            {
              echo "body<<BODY_EOF"
              echo "## Automated flake input update"
              echo ""
              echo "**Triggered by:** ${{ github.event_name }}"
              echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo ""
              echo "### What changed"
              echo ""
              echo '```diff'
              diff flake.lock.before flake.lock | head -100 || true
              echo '```'
              echo ""
              echo "### Review checklist"
              echo ""
              echo "- [ ] nixpkgs / nixpkgs-unstable bump reviewed"
              echo "- [ ] home-manager version compatible"
              echo "- [ ] sops-nix version pinning still appropriate"
              echo "- [ ] CI passes on this branch before merging"
              echo ""
              echo "> ⚠️ Review carefully — input updates can introduce breaking changes."
              echo "BODY_EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.summary.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # NO "[skip ci]" here: the update PR is exactly where the
          # pipeline earns its keep — T6.3's evidence chain relies on
          # "every PR opened by this workflow runs the full CI"
          # (external-input breakage caught before merge), and the PR
          # body's own checklist asks for "CI passes on this branch
          # before merging". A skip marker would suppress both — the
          # marker was template residue, not intent.
          commit-message: "chore(flake): update flake inputs"
          title: "chore(flake): update flake inputs — ${{ github.run_id }}"
          body: ${{ steps.summary.outputs.body }}
          branch: automation/update-flake-inputs
          delete-branch: true
          labels: |
            dependencies
            automated
          assignees: ${{ github.repository_owner }}

      - name: Skip message (no changes)
        if: steps.summary.outputs.changed == 'false'
        run: echo "All flake inputs are already up to date — no PR created."
