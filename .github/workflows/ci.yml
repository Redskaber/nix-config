  # ─────────────────────────────────────────────────────────────
  # STAGE 5: Security Audit
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # T16.1: supply-chain pinning contract — fail-fast (pure grep, runs
      # before nix/sops install). Every third-party action must be referenced
      # by an immutable 40-hex commit SHA, with the tag the SHA was resolved
      # from recorded as a trailing comment for humans and Dependabot.
      # Moving tags (@v4, @main) are MUTABLE: an owner force-push or a
      # deleted/retargeted tag silently changes what CI executes — a
      # compromise of the upstream repo is a compromise of this pipeline.
      # Local composite actions (./path) are exempt (in-tree code is already
      # content-addressed by git). This makes the convention a machine-checked
      # invariant: a new unpinned ref cannot land green.
      - name: Enforce SHA-pinned action refs (T16.1)
        run: |
          set -euo pipefail
          # The initial grep is ANCHORED to the YAML key form (line content is
          # exactly "uses:" or "- uses:") on purpose: this script's own grep
          # lines contain the literal string "uses:", and an unanchored match
          # would make the contract flag itself and fail forever. Comment
          # lines cannot match the anchor either, so no comment filter is
          # needed — one grep, one responsibility.
          VIOLATIONS=$(grep -rnE '^[[:space:]]*(-[[:space:]]*)?uses:' .github/workflows/*.yml \
            | grep -vE "uses:[[:space:]]*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}([[:space:]]+#.+)?$|uses:[[:space:]]*\./" \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Action refs not pinned to a 40-hex commit SHA:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK: every action ref is an immutable commit SHA (mutable tags rejected)"

      # Conf drift found in the 38085235502 audit: the other seven legs'
      # extra-conf all carry accept-flake-config = true; this leg's omission
      # only survived because its nix usage never consults flake trust —
      # align it rather than rely on that staying true.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      # T9.1: sops from the LOCKED nixpkgs (statix note in the lint job) —
      # a registry sops could change decrypt semantics mid-pipeline.
      - name: Install SOPS
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix profile install "$PKGS#sops"

      # Every file under secrets/chipr/ must be SOPS-encrypted (not
      # plaintext). EMPTY lifecycle state (fresh clone, pre-bootstrap):
      # zero blobs is the ENTRY state — they are born from `just
      # secrets-init` + `just secret-set`, never committed by hand.
      - name: Validate SOPS encrypted files
        run: |
          if ! [ -d secrets/chipr ] || [ -z "$(find secrets/chipr -name '*.yaml' -print -quit 2>/dev/null)" ]; then
            echo "OK: no encrypted blobs yet (EMPTY lifecycle state, pre-bootstrap)"
            exit 0
          fi
          COUNT=0
          FAILED=0
          find secrets/chipr -name "*.yaml" | while IFS= read -r f; do
            COUNT=$((COUNT+1))
            echo "Checking: $f"
            if ! grep -q "^sops:" "$f"; then
              echo "::error file=$f::Missing SOPS metadata — file may be plaintext!"
              FAILED=$((FAILED+1))
            fi
          done
          if find secrets/chipr -name "*.yaml" -print0 | xargs -0 grep -rL "^sops:" 2>/dev/null | grep -q .; then
            echo "ERROR: Some chipr secret files are missing sops metadata" >&2
            find secrets/chipr -name "*.yaml" -print0 | xargs -0 grep -rL "^sops:" 2>/dev/null
            exit 1
          fi
          echo "All chipr secret files have sops metadata ($COUNT file(s))"

      # secrets/plan/ must never be tracked by git (plaintext secrets)
      - name: Check secrets/plan is not git-tracked
        run: |
          if git ls-files secrets/plan 2>/dev/null | grep -q .; then
            echo "::error::secrets/plan/ contains git-tracked files (plaintext secrets)!"
            git ls-files secrets/plan
            exit 1
          fi
          echo "OK: secrets/plan/ is not git-tracked"

      # ── T3.3: decrypt gate ─────────────────────────────────────────
      # When the repo secret AGE_SECRET_KEY is provisioned (an age private
      # key, AGE-SECRET-KEY-1…), every blob under secrets/ must decrypt
      # end-to-end. This closes the loop the metadata check above can't:
      # a blob can carry valid sops metadata AND still be undecryptable
      # (rotated-away key, corrupted ciphertext, hierarchy drift).
      # Without the secret the step is skipped — visible, not silent.
      #
      # The env NAME must be sops's identity lookup, not the secret's
      # name: sops reads ONLY SOPS_AGE_KEY / SOPS_AGE_KEY_FILE /
      # SOPS_AGE_KEY_CMD (+ ssh/file fallbacks) — injecting the private
      # key under any other variable reproduces "failed to load age
      # identities" with the key present (the 2026-10 incident this
      # block was fixed from; vm-tests below already used the correct
      # name). AGE_SECRET_KEY stays the REPO SECRET name only.
      - name: Decrypt gate (AGE_SECRET_KEY)
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        if: env.SOPS_AGE_KEY != ''
        run: |
          echo "::add-mask::$SOPS_AGE_KEY"
          FAILED=0
          # plan/ is not a pipeline member (secrets-rotate.sh BLOB_FIND
          # excludes it: plaintext-by-design plan files carry no sops
          # metadata and would fabricate NO-RULE drift here). Scope
          # alignment — CI checkouts never contain plan/ while it stays
          # untracked, but the gate's intent is now spelled out.
          for f in $(find secrets -name '*.yaml' -not -path 'secrets/plan/*' 2>/dev/null | sort); do
            if ! sops -d --output /dev/null "$f"; then
              echo "::error file=$f::sops decrypt failed — key rotated away or ciphertext corrupted"
              FAILED=1
            fi
          done
          if (( FAILED )); then exit 1; fi
          echo "decrypt gate: all secret blobs decrypt with the provisioned key."

      - name: Decrypt gate (AGE_SECRET_KEY) — not provisioned
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        if: env.SOPS_AGE_KEY == ''
        run: |
          echo "::warning::AGE_SECRET_KEY not provisioned — decrypt gate SKIPPED."
          echo "Provision it (repo Settings → Secrets → Actions, name: AGE_SECRET_KEY) to enforce end-to-end decryptability."

      # .sops.yaml is a GENERATED artifact (docs/tmpl/sops/sops-rules.yaml.tmpl
      # → `just secrets-init`); the repo ships in the EMPTY pre-bootstrap
      # state without it. Once bootstrapped it is committed (public keys
      # only) and this validation turns strict.
      - name: Validate .sops.yaml structure
        run: |
          if [ ! -f .sops.yaml ]; then
            echo "OK: no .sops.yaml yet (EMPTY lifecycle state — generated by 'just secrets-init' from docs/tmpl/sops/sops-rules.yaml.tmpl)"
            exit 0
          fi
          grep -q "age:" .sops.yaml || { echo "::error::.sops.yaml missing age key section" >&2; exit 1; }
          grep -q "creation_rules:" .sops.yaml || { echo "::error::.sops.yaml missing creation_rules" >&2; exit 1; }
          echo "OK: .sops.yaml valid"

      # Key hierarchy consistency: every secrets/**.yaml must be covered by a
      # creation_rule (NO-RULE = plaintext risk) and its metadata recipients
      # must equal that rule's key group (DRIFT = key change not yet applied).
      # The script executes creation_rules AS DATA — zero domain hardcoding.
      - name: Key hierarchy consistency (creation_rules vs blob recipients)
        run: scripts/sh/secrets-rotate.sh check

      # Scan for accidental hardcoded credentials in .nix files
      - name: Scan for potential plaintext secrets
        run: |
          FOUND=0
          # GitHub tokens
          if grep -rn --include="*.nix" -e 'token\s*=\s*"ghp_[A-Za-z0-9_]' lib/ platform/ home/ 2>/dev/null; then
            echo "::error::Potential hardcoded GitHub token detected in .nix files"
            FOUND=1
          fi
          # Generic password assignments
          if grep -rn --include="*.nix" -e 'password\s*=\s*"[^$"]\{8,\}"' lib/ platform/ home/ 2>/dev/null; then
            echo "::warning::Potential hardcoded password detected — review manually"
          fi
          [ "$FOUND" -eq 0 ] || exit 1
          echo "OK: No obvious hardcoded credentials found"

      # Validate .gitignore excludes sensitive paths
      - name: Validate .gitignore covers secrets/plan
        run: |
          if ! grep -q "secrets/plan" .gitignore 2>/dev/null; then
            echo "::warning::.gitignore may not exclude secrets/plan/ — verify manually"
          else
            echo "OK: .gitignore covers secrets/plan/"
          fi

  # ─────────────────────────────────────────────────────────────
  # STAGE 6: VM-based Tests (NixOS / HM / Lib / Integration planes)
  # ─────────────────────────────────────────────────────────────
  # These tests require QEMU KVM. GitHub-hosted ubuntu-latest runners
  # support nested virtualisation. The AGE_SECRET_KEY secret is injected
  # for SOPS decryption if available; tests that don't need it still pass.
  #
  # T7.3: one matrix leg per test PLANE. The planes face of the test
  # matrix (.#api.checks.planes.<plane>) is the partition SSOT — CI no
  # longer re-derives membership from name prefixes, so a new test
  # rides its plane by construction (plane membership is asserted
  # equal to the legacy prefix sets in the repo's verification
  # battery). Each leg hands the WHOLE plane to nix-fast-build from
  # the LOCKED nixpkgs (1.4.0 — same revision the flake pins, no
  # registry drift, nix-eval-jobs bundled): evaluation parallelises
  # and builds pipeline behind it; --skip-cached turns magic-nix-
  # cache hits into no-ops.
  vm-tests:
    name: VM Tests (${{ matrix.plane }})
    runs-on: ubuntu-latest
    needs: [lint, nmt-plane]
    strategy:
      matrix:
        plane:
          - smoke # Plane 0: baseline VM sanity
          - nixos # Plane 1: NixOS module tests
          - home # Plane 2: HM module tests
          - lib # Plane 3: lib/shared pure tests
          - integration # Plane 4: NixOS+HM joint tests
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7
        with:
          # Run 38085235502 paid 79 "Unable to authenticate to FlakeHub"
          # annotations: use-flakehub defaults to true and this repo has no
          # FlakeHub registration, so every run bought failed-auth noise.
          use-flakehub: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # T7.3: -j is explicit — nix-fast-build 1.4.0 otherwise inherits
      # Nix's own max-jobs (1 on stock runners). Exit code 1 on any
      # member failure; failures don't stop siblings (keep-going),
      # failing members are listed in the log.
      #
      # Diagnose pass (2026-10 nixos-plane incident): nix-eval-jobs
      # reports failures as "EVAL: N successes, M failures" plus the
      # failing attr NAMES — but the verbatim error text scrolls past
      # in a wall of parallel build output, so the log the incident
      # arrived with had the failure and none of its cause. On a
      # non-zero exit this step re-evaluates every member of the plane
      # INDIVIDUALLY (same force depth nix-eval-jobs uses — .drvPath):
      # a deterministic eval error reproduces with its full text right
      # here; a plane whose members all evaluate cleanly in isolation
      # points at build-side failures or transient workers (OOM), also
      # stated right here. Either way the next failure carries its own
      # diagnosis. Zero cost on the green path.
      - name: Build ${{ matrix.plane }} plane (nix-fast-build)
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          echo "::add-mask::$SOPS_AGE_KEY"
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          set +e
          nix run "$PKGS#nix-fast-build" -- \
            --no-nom --skip-cached -j "$(nproc)" \
            --flake ".#api.checks.planes.${{ matrix.plane }}"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::nix-fast-build exit $RC — re-evaluating each member individually to surface the verbatim error"
            MEMBERS=$(nix eval ".#api.checks.planes.${{ matrix.plane }}" \
              --apply builtins.attrNames --json \
              | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
            FAILED_EVAL=0
            for m in $MEMBERS; do
              if ! nix eval --raw ".#api.checks.planes.${{ matrix.plane }}.$m.drvPath" \
                   >/dev/null 2>"/tmp/eval_err_$m"; then
                echo "::error title=eval failed::$m"
                cat "/tmp/eval_err_$m"
                FAILED_EVAL=1
              fi
            done
            if [ "$FAILED_EVAL" -eq 0 ]; then
              echo "::warning::every member evaluates cleanly in isolation — the failure was build-side or transient (eval worker OOM?). Full cause is in the nix-fast-build log above; a re-run of this job distinguishes transient from persistent."
            fi
            exit "$RC"
          fi

  # ─────────────────────────────────────────────────────────────
  # STAGE 6.5: Host toplevels — closure-level build depth (T8.2)
  # ─────────────────────────────────────────────────────────────
  # The Mic92-parity move the T7.3 verdict deferred: building the real
  # system closures (not just test planes) in CI. Feasible on stock
  # runners because almost every path substitutes from
  # cache.nixos.org (same locked nixpkgs rev); magic-nix-cache covers
  # the repo's own derivations across runs. The build face is
  # data-driven — .#api.host-toplevels enumerates the inventory's
  # nixosHosts, so a new NixOS host joins this leg by construction.
  # darwin (aarch64-darwin) is evaluated only: building it needs a
  # darwin runner or a cross toolchain (eval-only step below).
  host-toplevels:
    name: Host Toplevels (closure build)
    runs-on: ubuntu-latest
    needs: [lint, deep-eval]
    # Round 16 cache bootstrap: 150 while the Cachix push below
    # captures the first full post-bump generation (the cold window —
    # runs 38085235502 and 38385434464 both died at the old 90-minute
    # bound mid desktop-stack, before any push could exist). Once the
    # cache holds a complete generation the substituter collapses the
    # rebuild into substitution; revisit toward the old bound then.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7
        with:
          # Run 38085235502 paid 79 "Unable to authenticate to FlakeHub"
          # annotations: use-flakehub defaults to true and this repo has no
          # FlakeHub registration, so every run bought failed-auth noise.
          use-flakehub: false

      # T8.2: same tool + same determinism as the plane legs —
      # nix-fast-build from the LOCKED nixpkgs, whole-face handoff,
      # --skip-cached turns cache hits (cache.nixos.org substitution +
      # magic-nix-cache) into no-ops; -j explicit (see vm-tests note).
      #
      # Diagnose pass (run 38085235502): this leg died cancelled by its
      # own 90-minute timeout after 89 minutes, and the nix-fast-build
      # wall of output was the ONLY signal — eval-side vs build-side
      # was guesswork (the vm-tests leg already carries the same pass
      # for the 2026-10 nixos-plane incident). On a non-zero exit,
      # re-evaluate each host toplevel drvPath individually (same force
      # depth nix-eval-jobs uses): a deterministic eval error reproduces
      # verbatim right here; a clean sweep points at build-side failure
      # with the cause in the log above. Zero cost on the green path.
      - name: Build host toplevels (nix-fast-build)
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          set +e
          nix run "$PKGS#nix-fast-build" -- \
            --no-nom --skip-cached -j "$(nproc)" \
            --flake ".#api.host-toplevels"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::nix-fast-build exit $RC — re-evaluating each host toplevel individually to surface the verbatim error"
            HOSTS=$(nix eval ".#api.host-toplevels" \
              --apply builtins.attrNames --json \
              | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
            FAILED_EVAL=0
            for h in $HOSTS; do
              if ! nix eval --raw ".#api.host-toplevels.$h.drvPath" \
                   >/dev/null 2>"/tmp/eval_err_$h"; then
                echo "::error title=eval failed::$h"
                cat "/tmp/eval_err_$h"
                FAILED_EVAL=1
              fi
            done
            if [ "$FAILED_EVAL" -eq 0 ]; then
              echo "::warning::every toplevel evaluates cleanly in isolation — the failure was build-side (see the nix-fast-build log above; a package's check phase is the usual suspect)."
              # T22.2 (run 38171937689): name the ROOT failing
              # derivations — the raw job log is sign-in gated, the
              # annotations are not. --keep-going drives the build
              # past the first failure so every genuinely-failed
              # derivation reports; the store already holds
              # nix-fast-build's successes, so this rebuilds only
              # the failures. Same convention as the darwin leg.
              for h in $HOSTS; do
                nix build --keep-going --no-link \
                  ".#api.host-toplevels.$h" \
                  >"/tmp/keepgoing_$h.log" 2>&1 || true
                sed -n "s/^error: build of '\([^']*\)'.*/\1/p" "/tmp/keepgoing_$h.log" \
                  | sort -u \
                  | while read -r DRV; do
                      echo "::error title=build failed (root)::$DRV"
                    done
              done
            fi
            exit "$RC"
          fi

      # P0 cache axis (round 16, fixed round 17) — the PUSH half. The
      # build above just materialised the toplevel closures in this
      # store; pushing them turns the next run's cold gap into
      # substitution. Opt-in, INERT until the repository owner sets
      # secret.CACHIX_AUTH_TOKEN (pull needs no secret — the cache is
      # public). Round-17 correction: the secrets context is NOT
      # available in step-level if: expressions (GitHub rejected
      # `always() && secrets.CACHIX_AUTH_TOKEN != ''` as "Unrecognized
      # named-value" — main@ccf9edb currently carries that invalid
      # file), so the emptiness guard lives INSIDE the script, where
      # the env-mapped token is legal — the same env-position
      # discipline as cache-attic.yml's ATTIC_TOKEN (its job-level
      # gate uses vars, which if: DOES see). `if: always()`
      # deliberately: a mid-closure build failure still caches the
      # successfully-built prefix for the retry (the timeout class
      # kills the whole job and cannot — the 150-minute bootstrap
      # bound above is what buys this step the time to exist). Tools
      # from the LOCKED nixpkgs (same discipline as nix-fast-build);
      # paths via outPath forcing (pure eval, no store realisation
      # needed to NAME an output), filtered to what the store
      # actually holds. cachix pushes each path's CLOSURE and skips
      # what the cache already holds (chunk-level dedup) — re-pushes
      # are no-ops. CLI shape note (round 18): `cachix push CACHE-NAME
      # [PATHS...]` — the cache name is a MANDATORY first positional
      # (one auth token can serve multiple caches); with no paths and
      # a non-TTY stdin the CLI reads newline-separated paths from
      # stdin (the `nix-store -qR … | cachix push <name>` pipe
      # pattern). The round-16 version omitted the name — the first
      # toplevel path would be silently treated as the cache name
      # ("cache not found" once a token existed); caught by local CLI
      # verification in round 18, before any run ever executed the
      # step (opt-in kept the bug latent, never live).
      - name: Push built closures to Cachix
        if: always()
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # The opt-in guard, in the one position where secrets are
          # legal: env-mapped here, checked by the shell. Unset secret
          # maps to the empty string — INERT by design, exit 0.
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "::notice title=cachix-push::CACHIX_AUTH_TOKEN unset - push step INERT (opt-in). Set the repository secret to enable."
            exit 0
          fi
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          mapfile -t HOSTS < <(nix eval ".#api.host-toplevels" --apply builtins.attrNames --json \
            | python3 -c 'import json,sys; [print(x) for x in json.load(sys.stdin)]')
          PATHS=()
          for h in "${HOSTS[@]}"; do
            P=$(nix eval --raw ".#api.host-toplevels.$h.outPath")
            if [ -e "$P" ]; then PATHS+=("$P"); fi
          done
          if [ "${#PATHS[@]}" -gt 0 ]; then
            nix run "$PKGS#cachix" -- push redskaber-nix-config "${PATHS[@]}"
          else
            echo "nothing built to push (build failed before any host completed)"
          fi

      # Cross-system closure: evaluation is the depth this x86_64-linux
      # leg keeps (deep-eval already forces it; this makes the intent
      # and the attrpath explicit at the leg that owns linux closure
      # depth). The build-depth upgrade this comment used to await
      # landed as STAGE 6.6 — a macos-latest (aarch64) runner now
      # builds the same closure natively; this eval force stays as the
      # zero-cost linux-side cross-system check.
      - name: Evaluate darwin system closure (cross-system, eval-only)
        run: nix eval --raw .#darwinConfigurations.darwin.system.drvPath

      # T20.1: colmena emission parity — the deploy face must re-emit
      # EXACTLY what this leg just built. colmena re-evaluates each
      # NixOS host through its own eval-config (plus four injected
      # modules: deployment options + key services over an empty
      # deployment.keys, all no-ops on this repo); the claim is the
      # toplevel derivation is content-identical, so .#colmenaHive
      # reuses the closures this leg built (cache hit, zero rebuild)
      # and a deploy never ships anything CI has not verified. The
      # hypothesis is argued from colmena 0.5.0 source (src/nix/hive/
      # eval.nix + modules.nix: injected modules are option
      # declarations and mapAttrs over an empty keys attrset;
      # mkBefore of an empty overlays list is a no-op) and gates
      # FIRST-RUN here — a mismatch is a loud, actionable signal (the
      # colmena-injected module surface drifted from inert), not noise.
      # Hosts enumerate from the inventory face (T18.1 pattern — no
      # hardcoded member list to rot).
      - name: Colmena emission parity (T20.1)
        run: |
          HOSTS=$(nix eval ".#api.targets.nixosHosts" --json \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          [ -n "$HOSTS" ] || { echo "ERROR: nixosHosts face is empty" >&2; exit 1; }
          for h in $HOSTS; do
            A=$(nix eval --raw ".#api.host-toplevels.$h.drvPath")
            B=$(nix eval --raw ".#colmenaHive.toplevel.$h.drvPath")
            if [ "$A" != "$B" ]; then
              echo "::error title=colmena emission drift::$h — primary $A vs colmena $B"
              echo "The deploy face re-emits a closure CI has not built." >&2
              echo "Inspect what colmena's injected modules changed (deployment" >&2
              echo "options are inert; keys are empty; overlays mkBefore is a" >&2
              echo "no-op) — and the version identity, TWO fields: the primary" >&2
              echo "stamps the toplevel through the flake lib (trivial." >&2
              echo "versionSuffix AND trivial.revisionWithDefault — the suffix" >&2
              echo "names the drv, the revision fills @revision@ and the json's" >&2
              echo "nixpkgsRevision inside the closure); mkColmenaNode restores" >&2
              echo "both stamps over colmena's raw eval (T22.1 + T24.1, run" >&2
              echo "38171937689 and its re-run: a suffix difference in the drv" >&2
              echo "names below is the first class; equal names with different" >&2
              echo "hashes is the second — diff the two derivations, the drift" >&2
              echo "converges on the identity leaf)." >&2
              exit 1
            fi
            echo "parity: $h — $A"
          done

  # ─────────────────────────────────────────────────────────────
  # STAGE 6.6: Darwin toplevels — native cross-system closure build
  # ─────────────────────────────────────────────────────────────
  # T8.2 documented the gate ("building it needs a darwin runner or a
  # cross toolchain — the path is prepared, the environment is the
  # gate"); macos-latest settles it: GitHub arms public repos with
  # M-series (aarch64-darwin) macOS runners, so the darwin closure
  # builds NATIVELY — no cross toolchain, no emulation. Same face
  # discipline as the linux leg: .#api.darwin-toplevels is
  # inventory-driven (a second darwin host joins by construction),
  # members are the nix-darwin toplevels (what darwin-rebuild
  # builds). Substitution: nixpkgs aarch64-darwin paths substitute
  # from cache.nixos.org (same locked rev), magic-nix-cache covers
  # the repo's own derivations across runs — first run pays the
  # nix-darwin core, then it's cached.
  darwin-toplevels:
    name: Darwin Toplevels (aarch64 closure build)
    runs-on: macos-latest
    needs: [lint, deep-eval]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Same toolchain identity discipline as the linux legs (run
          # 38136560662 adjudication — the extra-args input is dead
          # code in action v13, the env route is the only working
          # one): upstream Nix, not the Determinate fork — here the
          # aarch64-darwin build of the same pinned 2.35.2.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-aarch64-darwin.tar.xz

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7
        with:
          # Same 38085235502 lesson as everywhere: no FlakeHub
          # registration in this repo — opt out of the failed-auth
          # annotations.
          use-flakehub: false

      # Same tool + same determinism as the linux legs — nix-fast-
      # build from the LOCKED nixpkgs (aarch64-darwin member of the
      # same rev), whole-face handoff, --skip-cached turns cache hits
      # (cache.nixos.org substitution + magic-nix-cache) into no-ops.
      # -j via sysctl: macOS runners have no nproc(1). nix-eval-jobs
      # darwin performance notes concern eval-heavy faces; this face
      # is one member today. Diagnose pass mirrors host-toplevels:
      # on failure, re-evaluate each member individually — a
      # deterministic eval error reproduces verbatim right here, a
      # clean sweep points build-side with the cause in the log
      # above. Zero cost on the green path.
      - name: Build darwin toplevels (nix-fast-build)
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          set +e
          nix run "$PKGS#nix-fast-build" -- \
            --no-nom --skip-cached -j "$(sysctl -n hw.ncpu)" \
            --flake ".#api.darwin-toplevels"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::nix-fast-build exit $RC — re-evaluating each darwin toplevel individually to surface the verbatim error"
            HOSTS=$(nix eval ".#api.darwin-toplevels" \
              --apply builtins.attrNames --json \
              | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
            FAILED_EVAL=0
            for h in $HOSTS; do
              if ! nix eval --raw ".#api.darwin-toplevels.$h.drvPath" \
                   >/dev/null 2>"/tmp/eval_err_$h"; then
                echo "::error title=eval failed::$h"
                cat "/tmp/eval_err_$h"
                FAILED_EVAL=1
              fi
            done
            if [ "$FAILED_EVAL" -eq 0 ]; then
              echo "::warning::every darwin toplevel evaluates cleanly in isolation — the failure was build-side (see the nix-fast-build log above)."
              # T22.2 (run 38171937689, this leg's first run): the
              # build-side failure's root derivation was buried in a
              # sign-in-gated log — the reporter could not even paste
              # it, and the annotations carried only the workflow's
              # own messages. --keep-going drives the build past the
              # first failure so every genuinely-failed derivation
              # reports as a ::error annotation naming the root; the
              # store already holds nix-fast-build's successes, so
              # this rebuilds only the failures (minutes, not the
              # leg's 30-minute wall). Same convention as the linux
              # host-toplevels leg.
              for h in $HOSTS; do
                nix build --keep-going --no-link \
                  ".#api.darwin-toplevels.$h" \
                  >"/tmp/keepgoing_$h.log" 2>&1 || true
                sed -n "s/^error: build of '\([^']*\)'.*/\1/p" "/tmp/keepgoing_$h.log" \
                  | sort -u \
                  | while read -r DRV; do
                      echo "::error title=build failed (root)::$DRV"
                    done
              done
            fi
            exit "$RC"
          fi

  # ─────────────────────────────────────────────────────────────
  # STAGE 7: CI Summary
  # ─────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, deep-eval, nmt-plane, evaluate-devshells, output-faces, security, vm-tests, host-toplevels, darwin-toplevels]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Write GitHub Step Summary
        run: |
          # Test plane counts come from the single source of truth —
          # scripts/sh/test-count.sh parses the registries live, so the
          # summary table can never drift from the actual tree.
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage                    | Status                                                       |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------------------------|--------------------------------------------------------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint & Evaluate          | ${{ needs.lint.result }}                                     |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deep Evaluation          | ${{ needs.deep-eval.result }}                                |" >> "$GITHUB_STEP_SUMMARY"
          echo "| nmt-Plane (HM dotfiles)  | ${{ needs.nmt-plane.result }}                                |" >> "$GITHUB_STEP_SUMMARY"
          echo "| devShells dry-run        | ${{ needs.evaluate-devshells.result }}                       |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Output Faces (T11.1)    | ${{ needs.output-faces.result }}                             |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Audit           | ${{ needs.security.result }}                                 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| VM Tests (QEMU)          | ${{ needs.vm-tests.result }}                                 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Host Toplevels (T8.2)   | ${{ needs.host-toplevels.result }}                           |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Darwin Toplevels (T8.3) | ${{ needs.darwin-toplevels.result }}                         |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Plane Reference (live from scripts/sh/test-count.sh)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/sh/test-count.sh >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> pre-commit-check (nixfmt/statix/deadnix) is built by the lint stage and deep-eval forces every output to a derivation outPath." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required stage did not succeed
        # T13.2 (run #338): the gate used to test only == 'failure' — a
        # leg CANCELLED by its own timeout (deep-eval hit 90:00 exactly)
        # escaped the gate entirely and the summary went green under a
        # cancelled run. '!= success' catches that class AND the
        # skipped-by-upstream-failure class (a cancelled lint starves the
        # legs that need it; skipped is not green either).
        if: |
          needs.lint.result != 'success' ||
          needs.deep-eval.result != 'success' ||
          needs.nmt-plane.result != 'success' ||
          needs.evaluate-devshells.result != 'success' ||
          needs.output-faces.result != 'success' ||
          needs.security.result != 'success' ||
          needs.vm-tests.result != 'success' ||
          needs.host-toplevels.result != 'success' ||
          needs.darwin-toplevels.result != 'success'
        run: |
          echo "One or more required stages did not succeed (failure or cancelled or skipped)."
          echo "Note: mark all nine as required status checks in branch protection."
          exit 1
