      - name: Force darwinConfigurations face to derivation depth
        run: |
          NAMES=$(nix eval .#darwinConfigurations --apply builtins.attrNames --json \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          COUNT=0
          for n in $NAMES; do
