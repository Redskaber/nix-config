name: nix-config CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════
# Pipeline architecture (9 stages):
#
#   STAGE 1: lint          — static analysis (statix/nixfmt/deadnix) + shallow eval
#   STAGE 2: deep-eval     — facet forcing: api envelope, host
#                toplevels, misc checks + completeness audit (T15.1)
#   STAGE 3: nmt-plane     — HM dotfile assertions (pure Nix eval, no KVM)
#   STAGE 4: devshells     — devShell dry-run matrix
#   STAGE 4.5: output-faces — drvPath-force the faces deep-eval alone
#                would cover only path-dependently (T11.1, no KVM)
#   STAGE 5: security      — SOPS secret integrity audit + supply-chain
#                pinning contract (every action ref must be a 40-hex SHA)
#   STAGE 6: vm-tests      — NixOS/HM/Lib/Integration QEMU tests (KVM)
#   STAGE 6.5: host-toplevels — system closure builds (T8.2, no KVM)
#   STAGE 7: summary       — aggregate result report (gates ALL stages)
#
# Deep evaluation (STAGE 2):
#   The old "sopsFile local path" blocker is GONE — deep eval of
#   nixosConfigurations/homeConfigurations works in BOTH lifecycle
#   states. Post-bootstrap (blobs committed): paths resolve in the store
#   source. Pre-bootstrap (fresh clone, EMPTY state — no .sops.yaml, no
#   blobs): lib/shared/shared/validate.nix tolerates a zero-blob tree at
#   eval with a trace and leaves the hard failure to sops activation,
#   where it belongs; once ANY blob exists the check is strict again
#   (declared-but-not-provided dies at eval). What deep eval ACTUALLY
#   caught when first wired: git-hooks.nix had removed the
#   nixfmt-rfc-style hook alias AND changed `run` to return a derivation
#   directly, so the old `//` merge dropped pre-commit-check from checks
#   entirely while shallow attrNames eval stayed green. Deep eval is now
#   a hard gate.
#
# KVM note:
#   QEMU VM tests (Plane 1–4) require /dev/kvm. GitHub-hosted ubuntu-latest
#   runners provide KVM via nested virtualisation. nmt-Plane (Plane 5) is
#   pure Nix eval — no QEMU, no KVM.
# ══════════════════════════════════════════════════════════════════════

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: Lint & Evaluate
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7

      - name: Verify formatter evaluates
        run: nix eval .#formatter.x86_64-linux.name

      - name: Verify devShells attrset is non-empty
        run: |
          SHELLS=$(nix eval .#devShells.x86_64-linux --apply builtins.attrNames --json)
          echo "devShells: $SHELLS"
          COUNT=$(echo "$SHELLS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Total: $COUNT shells"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: devShells is empty" >&2; exit 1; }

      # Structural validation — attrNames only avoids evaluating sopsFile paths
      - name: Verify nixosConfigurations structure (shallow)
        run: nix eval .#nixosConfigurations --apply builtins.attrNames --json

      - name: Verify homeConfigurations structure (shallow)
        run: nix eval .#homeConfigurations --apply builtins.attrNames --json

      - name: Verify debug outputs
        run: |
          nix eval .#debug.test_system
          nix eval .#debug.test_devDir

      # Verify checks attrset is parseable and non-empty
      - name: Verify checks attrset (shallow)
        run: |
          SYS=$(nix eval --raw .#debug.test_system)
          CHECKS=$(nix eval ".#checks.${SYS}" --apply builtins.attrNames --json)
          COUNT=$(echo "$CHECKS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Total checks: $COUNT (system: $SYS)"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: checks is empty" >&2; exit 1; }

          # Print plane breakdown (T7.3: read the planes face of the
          # test matrix — the partition SSOT — instead of re-deriving
          # membership from name prefixes)
          nix eval .#api.checks.planes \
            --apply 'p: builtins.mapAttrs (_: v: builtins.length (builtins.attrNames v)) p' \
            --json | python3 -m json.tool

      # Static analysis (Nix anti-patterns). T9.1: statix from the LOCKED
      # nixpkgs — the same revision the flake pins and its own
      # pre-commit-check builds against. A registry ref resolves to
      # nixpkgs-unstable on the runner and drifts mid-pipeline: the same
      # run could disagree with the flake's own hooks. Same shape as the
      # T7.3 nix-fast-build legs (store-path flake ref, zero registry).
      - name: statix lint
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix run "$PKGS#statix" -- check .

      # Formatting drift gate (same formatter the flake exports).
      # T9.1: locked-nixpkgs nixfmt — registry ref retired (statix note).
      - name: nixfmt check
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix run "$PKGS#nixfmt" -- --check \
            $(git ls-files '*.nix' | grep -v -E '(^|/)([^/]*-config)/' || true)

      # Dead-code gate — mirrors the pre-commit hook settings: the tree
      # standardises on uniform module heads ({ inputs, shared, lib,
      # config, pkgs, ... }) and overlay pairs (final: prev:), so unused
      # lambda names/patterns are exempted; dead `let` bindings still fail.
      # T9.1: locked-nixpkgs deadnix (statix note).
      - name: deadnix check
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix run "$PKGS#deadnix" -- \
            --no-lambda-pattern-names --no-lambda-arg --fail \
            $(git ls-files '*.nix')

      # The real three-hook gate (nixfmt + statix + deadnix over the whole
      # tree, as one derivation). The prefix-driven vm-tests matrix cannot
      # select `pre-commit-check`, so it is built here explicitly.
      - name: Build pre-commit-check derivation
        run: nix build .#checks.x86_64-linux.pre-commit-check --no-link

      # T8.1: the docs-SSOT contract — same plane-less situation as
      # pre-commit-check (deep-eval only EVALUATES it; the anchor
      # assertions fire at build time), so it is built here, right
      # next to its sibling repo-hygiene gate. A count that drifts in
      # README.md or docs/tests/test-matrix.md turns this step red.
      - name: Build docs-ssot-check derivation (T8.1)
        run: nix build .#checks.x86_64-linux.docs-ssot-check --no-link

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: Deep evaluation — facet forcing (T15.1)
  # ─────────────────────────────────────────────────────────────
  # The former `nix flake check --no-build` single-process walk was
  # retired on evidence. It evaluates all 95 checks in ONE process,
  # accumulating live evaluation state monotonically — the local 4GB
  # sandbox OOMs at the 9th derivation (measured, anon-rss ~2GB and
  # climbing), a 7GB runner sits at the cliff edge and crawls: run
  # #338 hit the 90-min timeout mid-walk; the first 120-min-window
  # run was STILL evaluating at 49min+ (same tree). Meanwhile the
  # output-faces leg — same cold store, same inputs, same day —
  # finishes in 1m52s because every member is a short-lived process.
  # Facet forcing keeps the deep-eval CONTRACT (evaluation-level
  # proof for every flake output face) but distributes it across
  # short-lived processes (measured peak RSS ~1GB for the heaviest
  # face — one host toplevel — which the process releases on exit):
  #   api envelope         — this leg (no other leg owns this face)
  #   nixosConfigurations  — this leg (the evaluation proof the
  #                          host-toplevels BUILD leg gates on)
  #   misc checks (2)      — this leg; the planes own the other 93
  #                          (vm-tests BUILDS them — stronger)
  #   packages/home/darwin — output-faces leg (T11.1)
  #   devShells            — evaluate-devshells leg
  #   formatter            — lint leg (pinned nixfmt, and runs it)
  # The completeness audit (face 4) replaces flake check's implicit
  # "walks everything" backstop with an explicit one: every check
  # attr must be owned by a plane or the misc list, so a new test
  # file that escapes the plane registry turns THIS leg red.
  deep-eval:
    name: Deep Evaluation (facet forcing)
    runs-on: ubuntu-latest
    needs: lint
    # 45 min (T15.1): one short-lived process per face member. Cold-path
    # input materialisation happens once for the NixOS-side set (the
    # toplevel forcings pull most of it); the audit faces are
    # shape-level evals (attrNames — no member thunk forcing) and
    # complete in seconds. The bound keeps ~2x headroom over the
    # expected 15-25min cold-path wall clock.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      # NO magic-nix-cache here — deliberate (2026-10 run #336 incident).
      # GitHub Actions Cache, the backend magic-nix-cache proxies, returned
      # ResourceExhausted (Twirp 418) for narinfo queries. Every miss made
      # Nix ban the substituter for 60 s, source paths mid-copy died as
      # "path '/nix/store/…-source' is not valid" — three attrs went red
      # (nixosConfigurations.kilig-nixos / .nixos,
      # checks.lib_shared_lang_validate; each proven green by its own
      # independent leg in the SAME run), and the stalled traversal ran
      # the job into its 90-minute timeout.
      # This leg is PURE EVALUATION: facet forcing evaluates
      # derivations to drvPath, nothing substitutes — a build cache has
      # nothing to offer, so its only effect was the failure surface
      # itself. Flake input sources materialise from their upstream
      # (github tarballs) regardless of substituters. The same reasoning
      # removes the cache from the other two pure-eval legs
      # (output-faces, evaluate-devshells). The BUILD legs (lint,
      # nmt-plane, vm-tests, host-toplevels) keep it: there it
      # substitutes real closures across runs and falls back to
      # cache.nixos.org when throttled.
      - name: Force output faces (api, toplevels, misc) + completeness audit
        run: |
          set -eo pipefail
          LOG=/tmp/deep-eval.log
          : > "$LOG"
          # Infrastructure signature class (T12.1): substituter and
          # network failures. Tree-side errors reproduce identically
          # and fail fast — retrying them only burns the window.
          INFRA_SIG='is not valid|unable to download|HTTP error|rate limit|ResourceExhausted|timed out|failed to fetch'

          # force <description> <command…>
          # One short-lived nix process per call. Infra-signature
          # failures get a single retry after 60s backoff — the former
          # whole-flake-check retry policy, now at facet granularity.
          force() {
            desc="$1"; shift
            echo "── forcing: $desc"
            start=$(wc -l < "$LOG")
            for ATTEMPT in 1 2; do
              if "$@" 2>&1 | tee -a "$LOG"; then
                echo "   ok: $desc"
                return 0
              fi
              if [ "$ATTEMPT" -eq 1 ] && tail -n +$((start + 1)) "$LOG" | grep -qE "$INFRA_SIG"; then
                echo "::warning::infrastructure-class failure on '$desc' — one retry after 60s backoff"
                sleep 60
                continue
              fi
              break
            done
            echo "::error title=deep-eval: $desc failed::verbatim output above; infra-signature retry did not rescue it"
            return 1
          }

          # Face 1 — the api envelope (no other leg owns this face).
          force "api envelope attrNames" \
            nix eval .#api --apply 'builtins.attrNames'

          # Face 2 — nixosConfigurations toplevels, one short-lived
          # process per host. This is the evaluation proof the
          # host-toplevels BUILD leg (needs: deep-eval) stands on.
          HOSTS=$(nix eval --json .#nixosConfigurations \
                    --apply 'builtins.attrNames' | jq -r '.[]')
          if [ -z "$HOSTS" ]; then
            echo "::error title=deep-eval: empty nixosConfigurations::host enumeration returned nothing"
            exit 1
          fi
          for H in $HOSTS; do
            force "nixosConfigurations.$H.config.system.build.toplevel.drvPath" \
              nix eval --raw ".#nixosConfigurations.$H.config.system.build.toplevel.drvPath"
          done

          # Face 3 — the two misc checks. The planes own the other 93
          # (vm-tests builds them — stronger than eval); these two are
          # prefix-less, so this leg forces their evaluation level
          # (the lint leg BUILDS them — even stronger).
          for C in docs-ssot-check pre-commit-check; do
            force "checks.x86_64-linux.$C.drvPath" \
              nix eval --raw ".#checks.x86_64-linux.$C.drvPath"
          done

          # Face 4 — completeness audit: every check attr must be
          # owned by a plane (the vm-tests matrix builds it) or the
          # misc list above. A new test file not registered in a
          # plane turns this red. Shape-level evals (attrNames only,
          # no member thunk forcing — measured sub-second, ~0 RSS);
          # they read only the checked-out tree, so no infra retry:
          # a failure here is a tree-side defect and red is honest.
          nix eval --json .#checks.x86_64-linux \
            --apply 'builtins.attrNames' | jq -r '.[]' | sort > /tmp/all-checks.sorted
          nix eval --json .#api.checks.planes \
            --apply 'p: builtins.concatLists (builtins.map (k: builtins.attrNames p.${k}) (builtins.attrNames p))' \
            | jq -r '.[]' | sort > /tmp/planed.sorted
          { cat /tmp/planed.sorted
            echo docs-ssot-check
            echo pre-commit-check
          } | sort -u > /tmp/owned.sorted
          UNOWNED=$(comm -23 /tmp/all-checks.sorted /tmp/owned.sorted)
          if [ -n "$UNOWNED" ]; then
            echo "::error title=completeness audit failed::check attrs not owned by any plane or the misc list:"
            echo "$UNOWNED" | sed 's/^/   /'
            exit 1
          fi
          echo "   ok: completeness audit — all $(wc -l < /tmp/all-checks.sorted) check attrs owned"
          echo "deep-eval: all facets forced green"

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: nmt-Plane (pure Nix eval — no KVM, fastest feedback)
  # ─────────────────────────────────────────────────────────────
  # nmt tests evaluate HM module configuration and assert generated
  # dotfile content via bash scripts. No QEMU VM is involved.
  # This stage runs in parallel with devshells and security for
  # maximum pipeline throughput.
  nmt-plane:
    name: nmt-Plane (HM dotfile assertions)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7

      # T7.3: the plane address (.#api.checks.planes.nmt) replaces
      # prefix discovery + the per-check python loop — nix-fast-build
      # (from the LOCKED nixpkgs, the same revision the flake pins,
      # no registry drift) evaluates and builds the whole plane in
      # parallel. nmt derivations build without KVM (pure eval +
      # bash assertions).
      - name: Build nmt plane (nix-fast-build)
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix run "$PKGS#nix-fast-build" -- \
            --no-nom --skip-cached -j "$(nproc)" \
            --flake ".#api.checks.planes.nmt"

  # ─────────────────────────────────────────────────────────────
  # STAGE 4: Evaluate devShells (dry-run matrix)
  # ─────────────────────────────────────────────────────────────
  # devShells use self + "/home/core/dev" (materialised store path),
  # so path evaluation succeeds without the age private key.
  evaluate-devshells:
    name: Evaluate devShells (dry-run)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        shell: [rust, python, python-machine, nix, go, cpp, c, typescript, re]
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      # No magic-nix-cache: pure-eval leg (see the deep-eval incident
      # note) — dry-run evaluates and never substitutes.
      - name: Dry-run devShells.${{ matrix.shell }}
        run: nix build .#devShells.x86_64-linux.${{ matrix.shell }} --dry-run --no-link

  # ─────────────────────────────────────────────────────────────
  # STAGE 4.5: Output faces — derivation-depth forcing (T11.1)
  # ─────────────────────────────────────────────────────────────
  # The wslview lesson (2026-10, T9.3): an output face that only
  # deep-eval forces is covered PATH-DEPENDENTLY — `nix flake check`
  # stops at the first failing face, so while any earlier face is red,
  # later faces rot unseen. packages.wslview was broken for three
  # months and surfaced only when deep-eval first survived past the
  # checks face. This leg forces the three faces with no independent
  # forcing, unconditionally, in the parallel eval tier:
  #   packages             — drvPath, member by member (a failing
  #                           member is NAMED, not lost inside a
  #                           whole-face error — the T9.2 lesson)
  #   homeConfigurations   — activationPackage.drvPath per member
  #                           (the home plane tests are nixosTest VMs;
  #                           they never touch this face)
  #   darwinConfigurations — system.drvPath per member (the
  #                           host-toplevels eval step is cost-gated
  #                           behind deep-eval green; this one is not)
  # Faces already independently forced: checks (vm-tests planes),
  # nixosConfigurations (host-toplevels builds), devShells (dry-run
  # matrix), formatter (lint), export modules (module-docs — itself a
  # packages member — forces every export module through its doc
  # eval). Member enumeration is attrNames of the face itself — a
  # new package or host joins by construction. Eval-only: no builds,
  # no KVM, no secret (paths resolve in the store source).
  output-faces:
    name: Output Faces (drvPath forcing)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      # No magic-nix-cache: pure-eval leg (see the deep-eval incident
      # note) — drvPath forcing evaluates and never substitutes.
      # The system tag comes from the flake itself (debug face) — the
      # same pattern the lint stage's checks-count step uses.
      - name: Force packages face to derivation depth
        run: |
          SYS=$(nix eval --raw .#debug.test_system)
          NAMES=$(nix eval ".#packages.$SYS" --apply builtins.attrNames --json \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          COUNT=0
          for n in $NAMES; do
            if ! nix eval --raw ".#packages.$SYS.$n.drvPath" >/dev/null; then
              echo "::error title=packages eval failed::$SYS.$n"
              exit 1
            fi
            echo "packages.$SYS.$n: drvPath ok"
            COUNT=$((COUNT+1))
          done
          echo "packages face: $COUNT member(s) forced"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: packages face is empty" >&2; exit 1; }

      - name: Force homeConfigurations face to derivation depth
        run: |
          NAMES=$(nix eval .#homeConfigurations --apply builtins.attrNames --json \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          COUNT=0
          for n in $NAMES; do
            if ! nix eval --raw ".#homeConfigurations.\"$n\".activationPackage.drvPath" >/dev/null; then
              echo "::error title=homeConfigurations eval failed::\"$n\""
              exit 1
            fi
            echo "homeConfigurations.\"$n\": activationPackage ok"
            COUNT=$((COUNT+1))
          done
          echo "homeConfigurations face: $COUNT member(s) forced"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: homeConfigurations face is empty" >&2; exit 1; }

      - name: Force darwinConfigurations face to derivation depth
        run: |
          NAMES=$(nix eval .#darwinConfigurations --apply builtins.attrNames --json \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          COUNT=0
          for n in $NAMES; do
            if ! nix eval --raw ".#darwinConfigurations.\"$n\".system.drvPath" >/dev/null; then
              echo "::error title=darwinConfigurations eval failed::$n"
              exit 1
            fi
            echo "darwinConfigurations.$n: system drvPath ok"
            COUNT=$((COUNT+1))
          done
          echo "darwinConfigurations face: $COUNT member(s) forced"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: darwinConfigurations face is empty" >&2; exit 1; }

  # ─────────────────────────────────────────────────────────────
  # STAGE 5: Security Audit
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # T16.1: supply-chain pinning contract — fail-fast (pure grep, runs
      # before nix/sops install). Every third-party action must be referenced
      # by an immutable 40-hex commit SHA, with the tag the SHA was resolved
      # from recorded as a trailing comment for humans and Dependabot.
      # Moving tags (@v4, @main) are MUTABLE: an owner force-push or a
      # deleted/retargeted tag silently changes what CI executes — a
      # compromise of the upstream repo is a compromise of this pipeline.
      # Local composite actions (./path) are exempt (in-tree code is already
      # content-addressed by git). This makes the convention a machine-checked
      # invariant: a new unpinned ref cannot land green.
      - name: Enforce SHA-pinned action refs (T16.1)
        run: |
          set -euo pipefail
          # The initial grep is ANCHORED to the YAML key form (line content is
          # exactly "uses:" or "- uses:") on purpose: this script's own grep
          # lines contain the literal string "uses:", and an unanchored match
          # would make the contract flag itself and fail forever. Comment
          # lines cannot match the anchor either, so no comment filter is
          # needed — one grep, one responsibility.
          VIOLATIONS=$(grep -rnE '^[[:space:]]*(-[[:space:]]*)?uses:' .github/workflows/*.yml \
            | grep -vE "uses:[[:space:]]*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}([[:space:]]+#.+)?$|uses:[[:space:]]*\./" \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Action refs not pinned to a 40-hex commit SHA:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK: every action ref is an immutable commit SHA (mutable tags rejected)"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      # T9.1: sops from the LOCKED nixpkgs (statix note in the lint job) —
      # a registry sops could change decrypt semantics mid-pipeline.
      - name: Install SOPS
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix profile install "$PKGS#sops"

      # Every file under secrets/chipr/ must be SOPS-encrypted (not
      # plaintext). EMPTY lifecycle state (fresh clone, pre-bootstrap):
      # zero blobs is the ENTRY state — they are born from `just
      # secrets-init` + `just secret-set`, never committed by hand.
      - name: Validate SOPS encrypted files
        run: |
          if ! [ -d secrets/chipr ] || [ -z "$(find secrets/chipr -name '*.yaml' -print -quit 2>/dev/null)" ]; then
            echo "OK: no encrypted blobs yet (EMPTY lifecycle state, pre-bootstrap)"
            exit 0
          fi
          COUNT=0
          FAILED=0
          find secrets/chipr -name "*.yaml" | while read f; do
            COUNT=$((COUNT+1))
            echo "Checking: $f"
            if ! grep -q "^sops:" "$f"; then
              echo "::error file=$f::Missing SOPS metadata — file may be plaintext!"
              FAILED=$((FAILED+1))
            fi
          done
          if find secrets/chipr -name "*.yaml" | xargs grep -rL "^sops:" 2>/dev/null | grep -q .; then
            echo "ERROR: Some chipr secret files are missing sops metadata" >&2
            find secrets/chipr -name "*.yaml" | xargs grep -rL "^sops:" 2>/dev/null
            exit 1
          fi
          echo "All chipr secret files have sops metadata ($COUNT file(s))"

      # secrets/plan/ must never be tracked by git (plaintext secrets)
      - name: Check secrets/plan is not git-tracked
        run: |
          if git ls-files secrets/plan 2>/dev/null | grep -q .; then
            echo "::error::secrets/plan/ contains git-tracked files (plaintext secrets)!"
            git ls-files secrets/plan
            exit 1
          fi
          echo "OK: secrets/plan/ is not git-tracked"

      # ── T3.3: decrypt gate ─────────────────────────────────────────
      # When the repo secret AGE_SECRET_KEY is provisioned (an age private
      # key, AGE-SECRET-KEY-1…), every blob under secrets/ must decrypt
      # end-to-end. This closes the loop the metadata check above can't:
      # a blob can carry valid sops metadata AND still be undecryptable
      # (rotated-away key, corrupted ciphertext, hierarchy drift).
      # Without the secret the step is skipped — visible, not silent.
      #
      # The env NAME must be sops's identity lookup, not the secret's
      # name: sops reads ONLY SOPS_AGE_KEY / SOPS_AGE_KEY_FILE /
      # SOPS_AGE_KEY_CMD (+ ssh/file fallbacks) — injecting the private
      # key under any other variable reproduces "failed to load age
      # identities" with the key present (the 2026-10 incident this
      # block was fixed from; vm-tests below already used the correct
      # name). AGE_SECRET_KEY stays the REPO SECRET name only.
      - name: Decrypt gate (AGE_SECRET_KEY)
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        if: env.SOPS_AGE_KEY != ''
        run: |
          echo "::add-mask::$SOPS_AGE_KEY"
          FAILED=0
          # plan/ is not a pipeline member (secrets-rotate.sh BLOB_FIND
          # excludes it: plaintext-by-design plan files carry no sops
          # metadata and would fabricate NO-RULE drift here). Scope
          # alignment — CI checkouts never contain plan/ while it stays
          # untracked, but the gate's intent is now spelled out.
          for f in $(find secrets -name '*.yaml' -not -path 'secrets/plan/*' 2>/dev/null | sort); do
            if ! sops -d --output /dev/null "$f"; then
              echo "::error file=$f::sops decrypt failed — key rotated away or ciphertext corrupted"
              FAILED=1
            fi
          done
          if (( FAILED )); then exit 1; fi
          echo "decrypt gate: all secret blobs decrypt with the provisioned key."

      - name: Decrypt gate (AGE_SECRET_KEY) — not provisioned
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        if: env.SOPS_AGE_KEY == ''
        run: |
          echo "::warning::AGE_SECRET_KEY not provisioned — decrypt gate SKIPPED."
          echo "Provision it (repo Settings → Secrets → Actions, name: AGE_SECRET_KEY) to enforce end-to-end decryptability."

      # .sops.yaml is a GENERATED artifact (docs/tmpl/sops/sops-rules.yaml.tmpl
      # → `just secrets-init`); the repo ships in the EMPTY pre-bootstrap
      # state without it. Once bootstrapped it is committed (public keys
      # only) and this validation turns strict.
      - name: Validate .sops.yaml structure
        run: |
          if [ ! -f .sops.yaml ]; then
            echo "OK: no .sops.yaml yet (EMPTY lifecycle state — generated by 'just secrets-init' from docs/tmpl/sops/sops-rules.yaml.tmpl)"
            exit 0
          fi
          grep -q "age:" .sops.yaml || { echo "::error::.sops.yaml missing age key section" >&2; exit 1; }
          grep -q "creation_rules:" .sops.yaml || { echo "::error::.sops.yaml missing creation_rules" >&2; exit 1; }
          echo "OK: .sops.yaml valid"

      # Key hierarchy consistency: every secrets/**.yaml must be covered by a
      # creation_rule (NO-RULE = plaintext risk) and its metadata recipients
      # must equal that rule's key group (DRIFT = key change not yet applied).
      # The script executes creation_rules AS DATA — zero domain hardcoding.
      - name: Key hierarchy consistency (creation_rules vs blob recipients)
        run: scripts/sh/secrets-rotate.sh check

      # Scan for accidental hardcoded credentials in .nix files
      - name: Scan for potential plaintext secrets
        run: |
          FOUND=0
          # GitHub tokens
          if grep -rn --include="*.nix" -e 'token\s*=\s*"ghp_[A-Za-z0-9_]' lib/ platform/ home/ 2>/dev/null; then
            echo "::error::Potential hardcoded GitHub token detected in .nix files"
            FOUND=1
          fi
          # Generic password assignments
          if grep -rn --include="*.nix" -e 'password\s*=\s*"[^$"]\{8,\}"' lib/ platform/ home/ 2>/dev/null; then
            echo "::warning::Potential hardcoded password detected — review manually"
          fi
          [ "$FOUND" -eq 0 ] || exit 1
          echo "OK: No obvious hardcoded credentials found"

      # Validate .gitignore excludes sensitive paths
      - name: Validate .gitignore covers secrets/plan
        run: |
          if ! grep -q "secrets/plan" .gitignore 2>/dev/null; then
            echo "::warning::.gitignore may not exclude secrets/plan/ — verify manually"
          else
            echo "OK: .gitignore covers secrets/plan/"
          fi

  # ─────────────────────────────────────────────────────────────
  # STAGE 6: VM-based Tests (NixOS / HM / Lib / Integration planes)
  # ─────────────────────────────────────────────────────────────
  # These tests require QEMU KVM. GitHub-hosted ubuntu-latest runners
  # support nested virtualisation. The AGE_SECRET_KEY secret is injected
  # for SOPS decryption if available; tests that don't need it still pass.
  #
  # T7.3: one matrix leg per test PLANE. The planes face of the test
  # matrix (.#api.checks.planes.<plane>) is the partition SSOT — CI no
  # longer re-derives membership from name prefixes, so a new test
  # rides its plane by construction (plane membership is asserted
  # equal to the legacy prefix sets in the repo's verification
  # battery). Each leg hands the WHOLE plane to nix-fast-build from
  # the LOCKED nixpkgs (1.4.0 — same revision the flake pins, no
  # registry drift, nix-eval-jobs bundled): evaluation parallelises
  # and builds pipeline behind it; --skip-cached turns magic-nix-
  # cache hits into no-ops.
  vm-tests:
    name: VM Tests (${{ matrix.plane }})
    runs-on: ubuntu-latest
    needs: [lint, nmt-plane]
    strategy:
      matrix:
        plane:
          - smoke # Plane 0: baseline VM sanity
          - nixos # Plane 1: NixOS module tests
          - home # Plane 2: HM module tests
          - lib # Plane 3: lib/shared pure tests
          - integration # Plane 4: NixOS+HM joint tests
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # T7.3: -j is explicit — nix-fast-build 1.4.0 otherwise inherits
      # Nix's own max-jobs (1 on stock runners). Exit code 1 on any
      # member failure; failures don't stop siblings (keep-going),
      # failing members are listed in the log.
      #
      # Diagnose pass (2026-10 nixos-plane incident): nix-eval-jobs
      # reports failures as "EVAL: N successes, M failures" plus the
      # failing attr NAMES — but the verbatim error text scrolls past
      # in a wall of parallel build output, so the log the incident
      # arrived with had the failure and none of its cause. On a
      # non-zero exit this step re-evaluates every member of the plane
      # INDIVIDUALLY (same force depth nix-eval-jobs uses — .drvPath):
      # a deterministic eval error reproduces with its full text right
      # here; a plane whose members all evaluate cleanly in isolation
      # points at build-side failures or transient workers (OOM), also
      # stated right here. Either way the next failure carries its own
      # diagnosis. Zero cost on the green path.
      - name: Build ${{ matrix.plane }} plane (nix-fast-build)
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          echo "::add-mask::$SOPS_AGE_KEY"
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          set +e
          nix run "$PKGS#nix-fast-build" -- \
            --no-nom --skip-cached -j "$(nproc)" \
            --flake ".#api.checks.planes.${{ matrix.plane }}"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::nix-fast-build exit $RC — re-evaluating each member individually to surface the verbatim error"
            MEMBERS=$(nix eval ".#api.checks.planes.${{ matrix.plane }}" \
              --apply builtins.attrNames --json \
              | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
            FAILED_EVAL=0
            for m in $MEMBERS; do
              if ! nix eval --raw ".#api.checks.planes.${{ matrix.plane }}.$m.drvPath" \
                   >/dev/null 2>"/tmp/eval_err_$m"; then
                echo "::error title=eval failed::$m"
                cat "/tmp/eval_err_$m"
                FAILED_EVAL=1
              fi
            done
            if [ "$FAILED_EVAL" -eq 0 ]; then
              echo "::warning::every member evaluates cleanly in isolation — the failure was build-side or transient (eval worker OOM?). Full cause is in the nix-fast-build log above; a re-run of this job distinguishes transient from persistent."
            fi
            exit "$RC"
          fi

  # ─────────────────────────────────────────────────────────────
  # STAGE 6.5: Host toplevels — closure-level build depth (T8.2)
  # ─────────────────────────────────────────────────────────────
  # The Mic92-parity move the T7.3 verdict deferred: building the real
  # system closures (not just test planes) in CI. Feasible on stock
  # runners because almost every path substitutes from
  # cache.nixos.org (same locked nixpkgs rev); magic-nix-cache covers
  # the repo's own derivations across runs. The build face is
  # data-driven — .#api.host-toplevels enumerates the inventory's
  # nixosHosts, so a new NixOS host joins this leg by construction.
  # darwin (aarch64-darwin) is evaluated only: building it needs a
  # darwin runner or a cross toolchain (eval-only step below).
  host-toplevels:
    name: Host Toplevels (closure build)
    runs-on: ubuntu-latest
    needs: [lint, deep-eval]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7

      # T8.2: same tool + same determinism as the plane legs —
      # nix-fast-build from the LOCKED nixpkgs, whole-face handoff,
      # --skip-cached turns cache hits (cache.nixos.org substitution +
      # magic-nix-cache) into no-ops; -j explicit (see vm-tests note).
      - name: Build host toplevels (nix-fast-build)
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix run "$PKGS#nix-fast-build" -- \
            --no-nom --skip-cached -j "$(nproc)" \
            --flake ".#api.host-toplevels"

      # Cross-system closure: evaluation is the depth we can afford on
      # an x86_64-linux runner (deep-eval already forces it; this makes
      # the intent and the attrpath explicit at the leg that owns
      # closure depth). A darwin runner (or cross toolchain) upgrades
      # this to a build step — the path is prepared, the environment
      # is the gate.
      - name: Evaluate darwin system closure (cross-system, eval-only)
        run: nix eval --raw .#darwinConfigurations.darwin.system.drvPath

  # ─────────────────────────────────────────────────────────────
  # STAGE 7: CI Summary
  # ─────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, deep-eval, nmt-plane, evaluate-devshells, output-faces, security, vm-tests, host-toplevels]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Write GitHub Step Summary
        run: |
          # Test plane counts come from the single source of truth —
          # scripts/sh/test-count.sh parses the registries live, so the
          # summary table can never drift from the actual tree.
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage                    | Status                                                       |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------------------|--------------------------------------------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Evaluate          | ${{ needs.lint.result }}                                     |" >> $GITHUB_STEP_SUMMARY
          echo "| Deep Evaluation          | ${{ needs.deep-eval.result }}                                |" >> $GITHUB_STEP_SUMMARY
          echo "| nmt-Plane (HM dotfiles)  | ${{ needs.nmt-plane.result }}                                |" >> $GITHUB_STEP_SUMMARY
          echo "| devShells dry-run        | ${{ needs.evaluate-devshells.result }}                       |" >> $GITHUB_STEP_SUMMARY
          echo "| Output Faces (T11.1)    | ${{ needs.output-faces.result }}                             |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit           | ${{ needs.security.result }}                                 |" >> $GITHUB_STEP_SUMMARY
          echo "| VM Tests (QEMU)          | ${{ needs.vm-tests.result }}                                 |" >> $GITHUB_STEP_SUMMARY
          echo "| Host Toplevels (T8.2)   | ${{ needs.host-toplevels.result }}                           |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Plane Reference (live from scripts/sh/test-count.sh)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          bash scripts/sh/test-count.sh >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> pre-commit-check (nixfmt/statix/deadnix) is built by the lint stage and deep-eval forces every output to a derivation outPath." >> $GITHUB_STEP_SUMMARY

      - name: Fail if any required stage did not succeed
        # T13.2 (run #338): the gate used to test only == 'failure' — a
        # leg CANCELLED by its own timeout (deep-eval hit 90:00 exactly)
        # escaped the gate entirely and the summary went green under a
        # cancelled run. '!= success' catches that class AND the
        # skipped-by-upstream-failure class (a cancelled lint starves the
        # legs that need it; skipped is not green either).
        if: |
          needs.lint.result != 'success' ||
          needs.deep-eval.result != 'success' ||
          needs.nmt-plane.result != 'success' ||
          needs.evaluate-devshells.result != 'success' ||
          needs.output-faces.result != 'success' ||
          needs.security.result != 'success' ||
          needs.vm-tests.result != 'success' ||
          needs.host-toplevels.result != 'success'
        run: |
          echo "One or more required stages did not succeed (failure or cancelled or skipped)."
          echo "Note: mark all eight as required status checks in branch protection."
          exit 1
