        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      # No magic-nix-cache: pure-eval leg (see the deep-eval incident
      # note) — dry-run evaluates and never substitutes.
      - name: Dry-run every devShell (face attrNames)
        run: |
          set -eo pipefail
          # System tag from the flake's own debug face — the same
          # pattern output-faces uses; no hardcoded x86_64-linux.
          SYS=$(nix eval --raw .#debug.test_system)
          NAMES=$(nix eval ".#devShells.$SYS" --apply builtins.attrNames --json \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          COUNT=0
          for n in $NAMES; do
            if ! nix build ".#devShells.$SYS.\"$n\"" --dry-run --no-link >/dev/null; then
              echo "::error title=devShells dry-run failed::$SYS.\"$n\""
              exit 1
            fi
            echo "devShells.$SYS.\"$n\": dry-run ok"
            COUNT=$((COUNT+1))
          done
          echo "devShells face: $COUNT member(s) dry-run"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: devShells face is empty" >&2; exit 1; }

  # ─────────────────────────────────────────────────────────────
  # STAGE 4.5: Output faces — derivation-depth forcing (T11.1)
  # ─────────────────────────────────────────────────────────────
  # The wslview lesson (2026-10, T9.3): an output face that only
  # deep-eval forces is covered PATH-DEPENDENTLY — `nix flake check`
  # stops at the first failing face, so while any earlier face is red,
  # later faces rot unseen. packages.wslview was broken for three
  # months and surfaced only when deep-eval first survived past the
  # checks face. This leg forces the three faces with no independent
  # forcing, unconditionally, in the parallel eval tier:
  #   packages             — drvPath, member by member (a failing
  #                           member is NAMED, not lost inside a
  #                           whole-face error — the T9.2 lesson)
  #   homeConfigurations   — activationPackage.drvPath per member
  #                           (the home plane tests are nixosTest VMs;
  #                           they never touch this face)
  #   darwinConfigurations — system.drvPath per member (the
  #                           host-toplevels eval step is cost-gated
  #                           behind deep-eval green; this one is not)
  # Faces already independently forced: checks (vm-tests planes),
  # nixosConfigurations (host-toplevels builds), devShells (dry-run
  # matrix), formatter (lint), export modules (module-docs — itself a
  # packages member — forces every export module through its doc
  # eval). Member enumeration is attrNames of the face itself — a
  # new package or host joins by construction. Eval-only: no builds,
  # no KVM, no secret (paths resolve in the store source).
  output-faces:
    name: Output Faces (drvPath forcing)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      # No magic-nix-cache: pure-eval leg (see the deep-eval incident
      # note) — drvPath forcing evaluates and never substitutes.
      # The system tag comes from the flake itself (debug face) — the
      # same pattern the lint stage's checks-count step uses.
      - name: Force packages face to derivation depth
        run: |
          SYS=$(nix eval --raw .#debug.test_system)
          NAMES=$(nix eval ".#packages.$SYS" --apply builtins.attrNames --json \
            | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
          COUNT=0
          for n in $NAMES; do
            if ! nix eval --raw ".#packages.$SYS.$n.drvPath" >/dev/null; then
