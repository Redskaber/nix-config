name: nix-config CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════
# Pipeline architecture (10 stages):
#
#   STAGE 1: lint          — static analysis (statix/nixfmt/deadnix) + shallow eval
#   STAGE 2: deep-eval     — facet forcing: api envelope, host
#                toplevels, misc checks + completeness audit (T15.1)
#   STAGE 3: nmt-plane     — HM dotfile assertions (pure Nix eval, no KVM)
#   STAGE 4: devshells     — devShell dry-run, face attrNames (T18.1)
#   STAGE 4.5: output-faces — drvPath-force the faces deep-eval alone
#                would cover only path-dependently (T11.1, no KVM)
#   STAGE 5: security      — SOPS secret integrity audit + supply-chain
#                pinning contract (every action ref must be a 40-hex SHA)
#   STAGE 6: vm-tests      — NixOS/HM/Lib/Integration QEMU tests (KVM)
#   STAGE 6.5: host-toplevels — system closure builds (T8.2, no KVM)
#   STAGE 6.6: darwin-toplevels — native aarch64-darwin closure
#                builds on a macos runner (T8.3, no cross toolchain)
#   STAGE 7: summary       — aggregate result report (gates ALL stages)
#
# Deep evaluation (STAGE 2):
#   The old "sopsFile local path" blocker is GONE — deep eval of
#   nixosConfigurations/homeConfigurations works in BOTH lifecycle
#   states. Post-bootstrap (blobs committed): paths resolve in the store
#   source. Pre-bootstrap (fresh clone, EMPTY state — no .sops.yaml, no
#   blobs): lib/shared/shared/validate.nix tolerates a zero-blob tree at
#   eval with a trace and leaves the hard failure to sops activation,
#   where it belongs; once ANY blob exists the check is strict again
#   (declared-but-not-provided dies at eval). What deep eval ACTUALLY
#   caught when first wired: git-hooks.nix had removed the
#   nixfmt-rfc-style hook alias AND changed `run` to return a derivation
#   directly, so the old `//` merge dropped pre-commit-check from checks
#   entirely while shallow attrNames eval stayed green. Deep eval is now
#   a hard gate.
#
# KVM note:
#   QEMU VM tests (Plane 1–4) require /dev/kvm. GitHub-hosted ubuntu-latest
#   runners provide KVM via nested virtualisation. nmt-Plane (Plane 5) is
#   pure Nix eval — no QEMU, no KVM.
#
# Cache axis (P0, round 16 — the owner-side verb landed):
#   The public Cachix cache redskaber-nix-config is live (ZSTD, priority
#   41, public key pinned below in every leg). Two wiring halves, both
#   CI-layer concerns — the distributer belongs in the distribution
#   layer, which for a flake repo is the runner's nix.conf, never the
#   Nix config itself:
#     PULL is unconditional in every Install Nix leg below. The cache
#     is public (zero auth; a narinfo 404 is a no-op), and priority 41
#     keeps cache.nixos.org (priority 40) preferred wherever both hold
#     the path — the 5 GB free tier therefore serves ONLY the gap Hydra
#     cannot: the lock pins the nixos-26.05 moving-branch HEAD, which
#     runs AHEAD of Hydra's binary availability. That gap is exactly
#     the 90-minute source-build tail that killed runs 38085235502 and
#     38385434464 (13/14 jobs green; host-toplevels cancelled by its own
#     bound; one timeout leaves the closure uncached and the next run
#     cold again — the vicious cycle this wiring breaks).
#     PUSH is opt-in with the cache-attic.yml discipline: INERT until
#     the repository owner sets secret.CACHIX_AUTH_TOKEN (one secret,
#     no vars — the cache name and public key are public facts, pinned
#     like cache.nixos.org's identity). Round-17 correction on WHERE
#     the guard lives: secrets are invisible to if: expressions
#     (available contexts there: env/github/inputs/job/matrix/needs/
#     runner/steps/strategy/vars — GitHub's validator rejects a
#     secrets.* reference as "Unrecognized named-value"), so the
#     emptiness check is a script-side exit-0 on the env-mapped token;
#     only the vars route (cache-attic.yml's job gate) may test a
#     switch in an if: at all. The push step lives in the
#     host-toplevels leg right after the build it caches — zero extra
#     build, the store is warm. Its timeout rises 90 → 150 for the
#     cold-bootstrap window: the first post-lock-bump run must get
#     PAST the old bound once so the push can capture the gap
#     generation; once the cache holds a full generation, the
#     substituter collapses the rebuild into substitution and the
#     bound can be revisited. MNC stays (it carries the intra-run eval
#     legs) — its 418 rate-limit history (T12.1) and 10 GB / 7-day
#     eviction stay noted; this cache is the persistent layer MNC
#     structurally cannot be. Quota honesty: ~1–1.5 GB ZSTD per lock
#     generation, weekly bumps → the free tier holds ~3–4 generations;
#     the scale-out path stays documented in cache-attic.yml (attic)
#     and docs/ci/pipeline.md (harmonia).
# ══════════════════════════════════════════════════════════════════════

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: Lint & Evaluate
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7
        with:
          # Run 38085235502 paid 79 "Unable to authenticate to FlakeHub"
          # annotations: use-flakehub defaults to true and this repo has no
          # FlakeHub registration, so every run bought failed-auth noise.
          use-flakehub: false

      - name: Verify formatter evaluates
        run: nix eval .#formatter.x86_64-linux.name

      - name: Verify devShells attrset is non-empty
        run: |
          SHELLS=$(nix eval .#devShells.x86_64-linux --apply builtins.attrNames --json)
          echo "devShells: $SHELLS"
          COUNT=$(echo "$SHELLS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Total: $COUNT shells"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: devShells is empty" >&2; exit 1; }

      # Structural validation — attrNames only avoids evaluating sopsFile paths
      - name: Verify nixosConfigurations structure (shallow)
        run: nix eval .#nixosConfigurations --apply builtins.attrNames --json

      - name: Verify homeConfigurations structure (shallow)
        run: nix eval .#homeConfigurations --apply builtins.attrNames --json

      - name: Verify debug outputs
        run: |
          nix eval .#debug.test_system
          nix eval .#debug.test_devDir

      # Verify checks attrset is parseable and non-empty
      - name: Verify checks attrset (shallow)
        run: |
          SYS=$(nix eval --raw .#debug.test_system)
          CHECKS=$(nix eval ".#checks.${SYS}" --apply builtins.attrNames --json)
          COUNT=$(echo "$CHECKS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Total checks: $COUNT (system: $SYS)"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: checks is empty" >&2; exit 1; }

          # Print plane breakdown (T7.3: read the planes face of the
          # test matrix — the partition SSOT — instead of re-deriving
          # membership from name prefixes)
          nix eval .#api.checks.planes \
            --apply 'p: builtins.mapAttrs (_: v: builtins.length (builtins.attrNames v)) p' \
            --json | python3 -m json.tool

      # Static analysis (Nix anti-patterns). T9.1: statix from the LOCKED
      # nixpkgs — the same revision the flake pins and its own
      # pre-commit-check builds against. A registry ref resolves to
      # nixpkgs-unstable on the runner and drifts mid-pipeline: the same
      # run could disagree with the flake's own hooks. Same shape as the
      # T7.3 nix-fast-build legs (store-path flake ref, zero registry).
      - name: statix lint
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          nix run "$PKGS#statix" -- check .

      # Formatting drift gate (same formatter the flake exports).
      # T9.1: locked-nixpkgs nixfmt — registry ref retired (statix note).
      # SC2046 repayment: the file list rides a mapfile'd array and
      # "${FILES[@]}" — one argument per file, zero word splitting;
      # a future path name containing spaces survives intact (the
      # unquoted $(git ls-files …) form was shellcheck-gated debt).
      - name: nixfmt check
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          mapfile -t FILES < <(git ls-files '*.nix' | grep -v -E '(^|/)([^/]*-config)/' || true)
          nix run "$PKGS#nixfmt" -- --check "${FILES[@]}"

      # Dead-code gate — mirrors the pre-commit hook settings: the tree
      # standardises on uniform module heads ({ inputs, shared, lib,
      # config, pkgs, ... }) and overlay pairs (final: prev:), so unused
      # lambda names/patterns are exempted; dead `let` bindings still fail.
      # T9.1: locked-nixpkgs deadnix (statix note). SC2046 repayment:
      # mapfile'd array + "${FILES[@]}" — see the nixfmt step note.
      - name: deadnix check
        run: |
          PKGS=$(nix eval --raw .#api.inputs.nixpkgs.outPath)
          mapfile -t FILES < <(git ls-files '*.nix')
          nix run "$PKGS#deadnix" -- \
            --no-lambda-pattern-names --no-lambda-arg --fail "${FILES[@]}"

      # The real three-hook gate (nixfmt + statix + deadnix over the whole
      # tree, as one derivation). The prefix-driven vm-tests matrix cannot
      # select `pre-commit-check`, so it is built here explicitly.
      - name: Build pre-commit-check derivation
        run: nix build .#checks.x86_64-linux.pre-commit-check --no-link

      # T8.1: the docs-SSOT contract — same plane-less situation as
      # pre-commit-check (deep-eval only EVALUATES it; the anchor
      # assertions fire at build time), so it is built here, right
      # next to its sibling repo-hygiene gate. A count that drifts in
      # README.md or docs/tests/test-matrix.md turns this step red.
      - name: Build docs-ssot-check derivation (T8.1)
        run: nix build .#checks.x86_64-linux.docs-ssot-check --no-link

      # T32: the third repo-hygiene gate — python-compiles every
      # composed testScript (eval-time direct module calls, build-
      # time compile()). The CI driver's pylyzer run is the
      # authoritative parser, but it sits behind the whole VM
      # closure — this gate surfaces the same class at the cheapest
      # possible layer, which is why it belongs in STAGE 1 with the
      # other gates.
      - name: Build testscript-syntax-check derivation (T32)
        run: nix build .#checks.x86_64-linux.testscript-syntax-check --no-link

      # T41: the fourth repo-hygiene gate — module-tree reachability
      # (the directory side of the ledger): every module dir under
      # home/ + platform/ must be reachable from the flake's evaluated
      # faces (7 graph roots + the devShells domain root; static and
      # dynamic ./${...} edge extraction with comment stripping;
      # a self-healing exemption ledger). Dead code that SHOULD be
      # wired is invisible to every other gate — round 19's srv/cache
      # was exactly this class, and this gate's own first scan caught
      # exp/sys/re dangling since 9440679. Same gating shape as the
      # siblings: constructs at eval, asserts at build.
      - name: Build module-reachability-check derivation (T41)
        run: nix build .#checks.x86_64-linux.module-reachability-check --no-link

      # T46: the fifth repo-hygiene gate — the platform tree-shape
      # layer: a pure readDir walk of platform/ asserting the v4
      # grammar (tag dirs only; only system/+home/ domains, at least
      # one; default.nix doors; module-dir-only payloads — bare .nix
      # at domain level is the arch-line corpse class, door-less dirs
      # are invisible to every gate). The 82 v3 corpses of run #369
      # were all this class: reachability caught them via the graph
      # walk, shape rejects the address space outright, at zero
      # evaluation cost. Same gating shape as the siblings.
      - name: Build platform-grammar-check derivation (T46)
        run: nix build .#checks.x86_64-linux.platform-grammar-check --no-link

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: Deep evaluation — facet forcing (T15.1)
  # ─────────────────────────────────────────────────────────────
  # The former `nix flake check --no-build` single-process walk was
  # retired on evidence. It evaluates all 98 checks in ONE process,
  # accumulating live evaluation state monotonically — the local 4GB
  # sandbox OOMs at the 9th derivation (measured, anon-rss ~2GB and
  # climbing), a 7GB runner sits at the cliff edge and crawls: run
  # #338 hit the 90-min timeout mid-walk; the first 120-min-window
  # run was STILL evaluating at 49min+ (same tree). Meanwhile the
  # output-faces leg — same cold store, same inputs, same day —
  # finishes in 1m52s because every member is a short-lived process.
  # Facet forcing keeps the deep-eval CONTRACT (evaluation-level
  # proof for every flake output face) but distributes it across
  # short-lived processes (measured peak RSS ~1GB for the heaviest
  # face — one host toplevel — which the process releases on exit):
  #   api envelope         — this leg (no other leg owns this face)
  #   nixosConfigurations  — this leg (the evaluation proof the
  #                          host-toplevels BUILD leg gates on)
  #   misc checks (2)      — this leg; the planes own the other 94
  #                          (vm-tests BUILDS them — stronger)
  #   packages/home/darwin — output-faces leg (T11.1)
  #   devShells            — evaluate-devshells leg
  #   formatter            — lint leg (pinned nixfmt, and runs it)
  # The completeness audit (face 4) replaces flake check's implicit
  # "walks everything" backstop with an explicit one: every check
  # attr must be owned by a plane or the misc list, so a new test
  # file that escapes the plane registry turns THIS leg red.
  deep-eval:
    name: Deep Evaluation (facet forcing)
    runs-on: ubuntu-latest
    needs: lint
    # 45 min (T15.1): one short-lived process per face member. Cold-path
    # input materialisation happens once for the NixOS-side set (the
    # toplevel forcings pull most of it); the audit faces are
    # shape-level evals (attrNames — no member thunk forcing) and
    # complete in seconds. The bound keeps ~2x headroom over the
    # expected 15-25min cold-path wall clock.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      # NO magic-nix-cache here — deliberate (2026-10 run #336 incident).
      # GitHub Actions Cache, the backend magic-nix-cache proxies, returned
      # ResourceExhausted (Twirp 418) for narinfo queries. Every miss made
      # Nix ban the substituter for 60 s, source paths mid-copy died as
      # "path '/nix/store/…-source' is not valid" — three attrs went red
      # (nixosConfigurations.kilig-nixos / .nixos,
      # checks.lib_shared_lang_validate; each proven green by its own
      # independent leg in the SAME run), and the stalled traversal ran
      # the job into its 90-minute timeout.
      # This leg is PURE EVALUATION: facet forcing evaluates
      # derivations to drvPath, nothing substitutes — a build cache has
      # nothing to offer, so its only effect was the failure surface
      # itself. Flake input sources materialise from their upstream
      # (github tarballs) regardless of substituters. The same reasoning
      # removes the cache from the other two pure-eval legs
      # (output-faces, evaluate-devshells). The BUILD legs (lint,
      # nmt-plane, vm-tests, host-toplevels) keep it: there it
      # substitutes real closures across runs and falls back to
      # cache.nixos.org when throttled.
      - name: Force output faces (api, toplevels, misc) + completeness audit
        run: |
          set -eo pipefail
          LOG=/tmp/deep-eval.log
          : > "$LOG"
          # Infrastructure signature class (T12.1): substituter and
          # network failures. Tree-side errors reproduce identically
          # and fail fast — retrying them only burns the window.
          INFRA_SIG='is not valid|unable to download|HTTP error|rate limit|ResourceExhausted|timed out|failed to fetch'

          # force <description> <command…>
          # One short-lived nix process per call. Infra-signature
          # failures get a single retry after 60s backoff — the former
          # whole-flake-check retry policy, now at facet granularity.
          force() {
            desc="$1"; shift
            echo "── forcing: $desc"
            start=$(wc -l < "$LOG")
            for ATTEMPT in 1 2; do
              if "$@" 2>&1 | tee -a "$LOG"; then
                echo "   ok: $desc"
                return 0
              fi
              if [ "$ATTEMPT" -eq 1 ] && tail -n +$((start + 1)) "$LOG" | grep -qE "$INFRA_SIG"; then
                echo "::warning::infrastructure-class failure on '$desc' — one retry after 60s backoff"
                sleep 60
                continue
              fi
              break
            done
            echo "::error title=deep-eval: $desc failed::verbatim output above; infra-signature retry did not rescue it"
            return 1
          }

          # Face 1 — the api envelope (no other leg owns this face).
          force "api envelope attrNames" \
            nix eval .#api --apply 'builtins.attrNames'

          # Face 2 — nixosConfigurations toplevels, one short-lived
          # process per host. This is the evaluation proof the
          # host-toplevels BUILD leg (needs: deep-eval) stands on.
          HOSTS=$(nix eval --json .#nixosConfigurations \
                    --apply 'builtins.attrNames' | jq -r '.[]')
          if [ -z "$HOSTS" ]; then
            echo "::error title=deep-eval: empty nixosConfigurations::host enumeration returned nothing"
            exit 1
          fi
          for H in $HOSTS; do
            force "nixosConfigurations.$H.config.system.build.toplevel.drvPath" \
              nix eval --raw ".#nixosConfigurations.$H.config.system.build.toplevel.drvPath"
          done

          # Face 3 — the five misc checks. The planes own the rest
          # (vm-tests builds them — stronger than eval); these five are
          # prefix-less, so this leg forces their evaluation level
          # (the lint leg BUILDS them — even stronger).
          for C in docs-ssot-check pre-commit-check testscript-syntax-check module-reachability-check platform-grammar-check; do
            force "checks.x86_64-linux.$C.drvPath" \
              nix eval --raw ".#checks.x86_64-linux.$C.drvPath"
          done

          # Face 4 — completeness audit: every check attr must be
          # owned by a plane (the vm-tests matrix builds it) or the
          # misc list above. A new test file not registered in a
          # plane turns this red. Shape-level evals (attrNames only,
          # no member thunk forcing — measured sub-second, ~0 RSS);
          # they read only the checked-out tree, so no infra retry:
          # a failure here is a tree-side defect and red is honest.
          nix eval --json .#checks.x86_64-linux \
            --apply 'builtins.attrNames' | jq -r '.[]' | sort > /tmp/all-checks.sorted
          nix eval --json .#api.checks.planes \
            --apply 'p: builtins.concatLists (builtins.map (k: builtins.attrNames p.${k}) (builtins.attrNames p))' \
            | jq -r '.[]' | sort > /tmp/planed.sorted
          { cat /tmp/planed.sorted
            echo docs-ssot-check
            echo pre-commit-check
            echo testscript-syntax-check
            echo module-reachability-check
            echo platform-grammar-check
          } | sort -u > /tmp/owned.sorted
          UNOWNED=$(comm -23 /tmp/all-checks.sorted /tmp/owned.sorted)
          if [ -n "$UNOWNED" ]; then
            echo "::error title=completeness audit failed::check attrs not owned by any plane or the misc list:"
            echo "$UNOWNED" | sed 's/^/   /'
            exit 1
          fi
          echo "   ok: completeness audit — all $(wc -l < /tmp/all-checks.sorted) check attrs owned"
          echo "deep-eval: all facets forced green"

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: nmt-Plane (pure Nix eval — no KVM, fastest feedback)
  # ─────────────────────────────────────────────────────────────
  # nmt tests evaluate HM module configuration and assert generated
  # dotfile content via bash scripts. No QEMU VM is involved.
  # This stage runs in parallel with devshells and security for
  # maximum pipeline throughput.
  nmt-plane:
    name: nmt-Plane (HM dotfile assertions)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
        env:
          # Toolchain identity pinned (run 38136560662 adjudication, closes
          # the open item from the 38085235502 record): install.determinate.
          # system's /stable resolved dynamically and could hand out
          # Determinate's Nix fork, whose eval-cores / lazy-trees settings
          # are unknown to the locked-nixpkgs upstream Nix — every call
          # warned. Verified on a live runner: with this env the installer
          # plans distribution=Nix with the standard nix.conf (no fork
          # settings, no determinate-nixd). The extra-args input is dead
          # code in action v13 (args.concat result is dropped), so the env
          # route is the only working one.
          NIX_INSTALLER_PREFER_UPSTREAM_NIX: true
        with:
          # R27 hardening (run 38638140684): the installer-binary download
          # from cf.install.determinate.systems timed out twice on that run
          # (nmt-Plane + Security Audit, 30s fetch timeout — runner-network
          # flake, not code). Pin the download to GitHub's own release CDN
          # instead (same origin as the checkout itself; keep in sync with
          # https://github.com/DeterminateSystems/nix-installer/releases).
          source-url: https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.2/nix-installer-x86_64-linux
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true
            # P0 cache axis (round 16): public Cachix pull — see the
            # workflow header for the design. Priority 41 sits behind
            # cache.nixos.org (40) so the free tier serves only the
            # Hydra gap.
            substituters = https://redskaber-nix-config.cachix.org https://cache.nixos.org
            trusted-public-keys = redskaber-nix-config.cachix.org-1:ziIAJzLVe11AexFTrAY3IZVTZQOWUa5vmFB3eeaW8zw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          # Upstream Nix 2.35.2 tarball — the version the locked nixpkgs
          # ships, closing the identity drift for good.
          nix-package-url: https://releases.nixos.org/nix/nix-2.35.2/nix-2.35.2-x86_64-linux.tar.xz

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@b46e247b898aa56e6d2d2e728dc6df6c84fdb738 # v7
        with:
          # Run 38085235502 paid 79 "Unable to authenticate to FlakeHub"
          # annotations: use-flakehub defaults to true and this repo has no
          # FlakeHub registration, so every run bought failed-auth noise.
